[versions]
spellbookPackageName = "org.fufu.spellbook"
# when spellbook version is increased, spellbookVersionCode should also be increased
spellbook = "1.3.3"
spellbookVersionCode = "8"
spellbookGithubLink = "https://github.com/ARoese/spellbook"

composableTable = "1.3.1"
jna = "5.19.1"
ktorSerializationKotlinxJson = "3.5.2"
materialIconsCore = "1.7.3"
material3 = "1.9.0"
slf4jApi = "2.0.18"
filekit = "0.14.2"

agp = "9.3.1"
android-compileSdk = "37"
android-minSdk = "24"
logbackAndroid = "3.0.0"
androidx-activityCompose = "1.13.0"
androidx-lifecycle = "2.11.0"
compose-multiplatform = "1.11.1"
datastore = "1.2.1"
kotlin = "2.4.10"
kotlinx-coroutines = "1.11.0"
koin = "4.2.2"
navigationCompose = "2.9.2"
kotlinSerialization = "1.11.0"
androidx-room = "3.0.1"
skikoAwtRuntimeWindowsX64 = "0.150.1"
sqlite = "2.7.0"
ksp = "2.3.11"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activityCompose" }
androidx-lifecycle-viewmodel = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
kotlinx-coroutines-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3"}
logback-android = { module = "com.github.tony19:logback-android", version.ref = "logbackAndroid" }
material-icons-core = { module = "org.jetbrains.compose.material:material-icons-core", version.ref = "materialIconsCore" }
compose-material-icons = { group = "androidx.compose.material", name = "material-icons-core", version = "1.7.8" }
compose-icons-fontawesome = { module = "br.com.devsrsouza.compose.icons:font-awesome", version = "1.1.1" }

kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version = "1.3.0" }
junit = { group = "junit", name = "junit", version = "4.13.2" }

compose-uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose-multiplatform" }
compose-uiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }

kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinSerialization" }
jetbrains-compose-navigation = { group = "org.jetbrains.androidx.navigation", name = "navigation-compose", version.ref= "navigationCompose"}

koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }

androidx-room-compiler = { group = "androidx.room3", name = "room3-compiler", version.ref = "androidx-room" }
androidx-room-runtime = { group = "androidx.room3", name = "room3-runtime", version.ref = "androidx-room" }
androidx-room-paging = { group = "androidx.room3", name = "room3-paging", version.ref = "androidx-room" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }

androidx-datastore = { module = "androidx.datastore:datastore", version.ref = "datastore" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-datastore-preferences-proto = { module = "androidx.datastore:datastore-preferences-proto", version.ref = "datastore" }

jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
net-jna-platform = { module = "net.java.dev.jna:jna-platform", version.ref = "jna" }
filekit = { module = "io.github.vinceglb:filekit-core", version.ref = "filekit"}
filekit-dialogs = { module = "io.github.vinceglb:filekit-dialogs-compose", version.ref = "filekit" }
composable-table = { module = "io.github.sunny-chung:composable-table", version.ref = "composableTable" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktorSerializationKotlinxJson" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktorSerializationKotlinxJson" }

slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4jApi" }

skiko-awt-runtime-windows-x64 = { module = "org.jetbrains.skiko:skiko-awt-runtime-windows-x64", version.ref = "skikoAwtRuntimeWindowsX64" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
room = { id = "androidx.room3", version.ref = "androidx-room" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

jetbrains-kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }